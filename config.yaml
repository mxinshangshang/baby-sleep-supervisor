  night_brightness_offset: 10
  night_clahe_clip_limit: 3.0
  night_clahe_enabled: true
  night_clahe_grid_size: 8
  night_contrast_boost: 1.4
  night_histogram_equalization: true
  night_preprocess_enabled: true
  presence_confirm_ratio: 0.8
  presence_score_threshold: 0.75
  presence_window_size: 12
  region_body_overlap_threshold: 0.4
  region_confirm_frames: 6
  region_detection_enabled: true
  region_exit_confirm_ratio: 0.8
  region_exit_window_size: 6
  region_torso_overlap_threshold: 0.5
  safe_region:
  - - 429
    - 184
  - - 925
    - 86
  - - 911
    - 539
  - - 412
    - 404
dual_camera:
  check_interval_frames: 30
  default_camera: 0
  enabled: true
  light_detection:
    day_threshold: 0.3
    min_switch_interval: 300
    night_threshold: 0.15
    stable_frames: 7
  night_camera_id: 1
  normal_camera_id: 0
  warmup_overlap_s: 2.0
inference:
  display_fps: 15
  enable_face_detection: true
  enable_pose_detection: true
  inference_fps: 3
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  model_complexity: 1
network:
  host: 127.0.0.1
  port: 65433
  recv_timeout_s: 0.2
  send_timeout_s: 5.0
notification:
  alert_cooldown_s: 10.0
  alert_level: warning
  capture_photo_on_alert: true
  console_enabled: true
  enabled_alert_types:
  - cry_detected
  - occlusion_detected
  - region_exit
  - region_enter
  - face_not_visible
  feishu_enabled: true
  feishu_secret: ''
  feishu_webhook: https://open.feishu.cn/open-apis/bot/v2/hook/your-webhook-token
preview:
  show_detection_boxes: true
  show_help: true
  show_safe_region: true
  show_statistics: true
  window_name: Baby Sleep Supervisor
process:
  max_restart_attempts: 5
  restart_backoff_base_s: 2
  restart_reset_after_s: 60
  status_log_interval_s: 30
storage:
  auto_cleanup_enabled: true
  enabled: true
  max_photo_size_mb: 1024
  photo_dir: data/photos
  photo_quality: 90
  sqlite_path: data/events.db
supervision:
  alert_cooldown_s: 10.0
  event_retention_days: 30
  severity_danger_threshold: 80.0
  severity_notice_threshold: 30.0
  severity_warning_threshold: 60.0
thermal:
  enabled: true
  temp_check_interval_s: 10.0
  temp_throttle_c: 75.0
  temp_warn_c: 65.0
  throttle_inference_fps: 2
  throttle_model_complexity: 0
