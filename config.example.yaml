# 婴儿睡眠监护系统配置示例
# 复制此文件为 config.yaml 并根据实际情况修改

camera:
  width: 640
  height: 480
  fps: 15
  jpeg_quality: 80
  format: RGB888
  device_id: 0

network:
  host: 127.0.0.1
  port: 65433
  recv_timeout_s: 0.2
  send_timeout_s: 5.0

inference:
  model_complexity: 1  # 模型复杂度: 0=快, 1=平衡, 2=准
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  # Heavy algorithm detection FPS. Preview FPS is configured separately under preview.
  inference_fps: 3
  display_fps: 10  # deprecated; use preview.display_fps
  enable_face_detection: true
  enable_pose_detection: true

detection:
  # 哭闹检测
  cry_detection_enabled: true
  cry_confidence_threshold: 0.7  # 置信度阈值，超过则认为在哭闹
  cry_duration_threshold: 2.0    # 持续时间阈值，超过则触发告警
  cry_sensitivity: medium        # 灵敏度: low/medium/high
  cry_hold_s: 8.0                # FaceMesh短暂丢失时保持最近哭闹状态
  mouth_open_window_size: 6      # 嘴巴张开持续性窗口
  mouth_variation_window_size: 6 # 嘴巴开合变化窗口
  distress_confidence_threshold: 0.70
  distress_duration_threshold: 1.5
  distress_window_size: 6

  # 踢被子/肢体裸露检测
  limb_exposure_enabled: true
  exposure_threshold: 0.35       # 裸露/覆盖提示阈值；实际告警还会受拓扑和外部手臂过滤影响
  exposure_duration_threshold: 15.0  # 持续时间阈值

  # 口鼻遮挡检测
  occlusion_detection_enabled: true
  occlusion_threshold: 0.6       # 遮挡置信度阈值
  occlusion_duration_threshold: 1.0  # 持续时间阈值（危险事件，阈值较小）

  # 区域检测
  region_detection_enabled: true
  safe_region: [[50, 50], [590, 430]]  # 也支持四点/多点多边形
  region_exit_duration_threshold: 3.0

  # 人体存在确认：姿态主导，人脸增强，兼容侧脸/背脸
  presence_window_size: 8
  presence_score_threshold: 0.55
  presence_confirm_ratio: 0.6
  presence_uncertain_grace_s: 2.0
  pose_visibility_threshold: 0.5
  pose_min_visible_landmarks: 6
  pose_min_core_landmarks: 2
  pose_min_body_bbox_area: 1800
  pose_min_torso_bbox_area: 500
  pose_bbox_padding_px: 12
  head_bbox_padding_px: 20
  face_min_bbox_area: 900
  region_body_overlap_threshold: 0.55
  region_torso_overlap_threshold: 0.50
  region_exit_window_size: 8
  region_exit_confirm_ratio: 0.7
  alert_requires_confirmed_presence: true
  face_absence_detection_enabled: true
  face_absence_duration_threshold: 45.0
  motion_window_size: 12

  # 呼吸检测（实验性功能）
  breath_detection_enabled: false
  breath_abnormal_threshold: 0.2

supervision:
  alert_cooldown_s: 60.0  # 同类告警冷却时间，避免重复通知
  severity_notice_threshold: 30.0
  severity_warning_threshold: 60.0
  severity_danger_threshold: 80.0
  event_retention_days: 30  # 事件和照片保留天数

thermal:
  enabled: true
  temp_warn_c: 65.0
  temp_throttle_c: 75.0
  temp_check_interval_s: 10.0
  throttle_inference_fps: 2
  throttle_model_complexity: 0

process:
  max_restart_attempts: 5
  restart_backoff_base_s: 2
  restart_reset_after_s: 60
  status_log_interval_s: 30

preview:
  window_name: Baby Sleep Supervisor
  show_help: true
  show_detection_boxes: true
  show_safe_region: true
  show_statistics: true
  display_fps: 15

notification:
  console_enabled: true
  feishu_enabled: true
  feishu_webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/你的飞书机器人webhook地址"
  feishu_secret: ""  # 如果机器人设置了签名校验，填写这里
  capture_photo_on_alert: true
  alert_level: "warning"  # 发送通知的最低级别: notice/warning/danger
  enabled_alert_types:
    - cry_detected
    - occlusion_detected
    - face_not_visible
    # Coverage/limb exposure is intentionally noisy in crib scenes; enable only if desired.
    # - limb_exposure
    - region_exit

storage:
  enabled: true
  sqlite_path: data/events.db
  photo_dir: data/photos
  photo_quality: 90
  max_photo_size_mb: 1024  # 照片存储最大容量，超过自动清理最早的
  auto_cleanup_enabled: true

audio:
  enabled: false
  device_id: 0
  sample_rate: 16000
  cry_detection_enabled: false  # 声音辅助哭闹检测（实验性功能）
